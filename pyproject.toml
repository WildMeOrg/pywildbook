[project]
name = "pywildbook"
version = "1.0.0"
description = "Python client for the Wildbook v3 API"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Kirk Larsen", email = "georgetownpolecat@gmail.com" },
    { name = "Wild Me", email = "info@wildme.org" },
]
keywords = ["wildbook", "wildlife", "conservation", "api", "client"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/WildMeOrg/pywildbook"
Repository = "https://github.com/WildMeOrg/pywildbook"
"Bug Tracker" = "https://github.com/WildMeOrg/pywildbook/issues"
Documentation = "https://docs.wildme.org/"

[project.optional-dependencies]
notebook = [
    "ipykernel>=6.31.0",
    "ipyleaflet>=0.20.0",
    "notebook>=7.5.6",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "nbstripout>=0.8.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.15.11",
]

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "integration: marks tests that require a running Wildbook server",
]
