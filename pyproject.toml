[project]
name = "pywildbook"
version = "0.1.0"
description = "Python client for the Wildbook v3 API"
readme = "README.md"
authors = [
    { name = "vkirkl", email = "georgetownpolecat@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=6.31.0",
    "ipyleaflet>=0.20.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.15.11",
]
