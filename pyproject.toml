[project]
name = "pywildbook"
version = "0.1.0"
description = "Python client for the Wildbook v3 API"
readme = "README.md"
authors = [
    { name = "vkirkl", email = "georgetownpolecat@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=6.31.0",
    "ipyleaflet>=0.20.0",
    "notebook>=7.0.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "nbstripout>=0.8.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.15.11",
]

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "integration: marks tests that require a running Wildbook server",
]
